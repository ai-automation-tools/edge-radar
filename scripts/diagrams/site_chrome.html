<!-- Edge-Radar chrome for the served diagram page (ER-31). build_betting_diagram.py
     splices each section into Archify's page: @head right after <head> (it must run before
     Archify's own theme script), @style right before </head> (after Archify's stylesheet, so
     equal-specificity rules here win), @bar right after <body>. The homepage's Light | Dark
     choice (edge-radar.theme, dark by default) becomes Archify's stored theme, so the diagram
     opens in the theme the reader picked instead of following the OS. -->
<!-- @head -->
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#060606">
  <meta name="description" content="Edge-Radar's betting path as data flow: every box links to the code it describes.">
  <script>
    (function () {
      var t = 'dark';
      try { if (localStorage.getItem('edge-radar.theme') === 'light') t = 'light'; localStorage.setItem('archify-theme', t); } catch (_) {}
      if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fafafa');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<!-- @style -->
  <style id="edge-radar-chrome">
    :root { --er-bar: 34px; }
    html[data-theme="dark"] { --bg: #060606; }
    body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    /* !important: Archify's compact and stage-rail layouts reset body padding with more specific rules */
    body { padding-top: calc(var(--archify-page-top) + var(--er-bar)) !important; }
    /* Archify positions the toolbar from the page top above 720px; below that it sits in flow */
    @media (min-width: 721px) { .toolbar, .toolbar .preset-menu, .toolbar .export-menu { margin-top: var(--er-bar); } }
    .er-src { position: absolute; top: 0; left: 0; right: 0; z-index: 60; display: flex; align-items: center; gap: 16px;
              height: var(--er-bar); padding: 0 16px; background: #0b0b0c; border-bottom: 1px solid rgba(39,39,42,.7);
              font: 12px/1.4 'Inter', system-ui, sans-serif; }
    .er-src a { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; color: #a1a1aa; text-decoration: none; }
    .er-src a:hover { color: #f4f4f5; }
    .er-src a:focus-visible { outline: 2px solid #34d399; outline-offset: 2px; border-radius: 4px; }
    .er-src .er-back { font-weight: 600; color: #34d399; }
    .er-src .er-note { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #7e7e87; }
    .er-src .er-link { margin-left: auto; flex: none; white-space: nowrap; }
    .er-src svg { width: 14px; min-width: 0; height: 14px; flex: none; } /* Archify sizes every svg to the diagram's */
    html[data-theme="light"] .er-src { background: #f4f4f5; border-bottom-color: #e4e4e7; }
    html[data-theme="light"] .er-src a { color: #52525b; }
    html[data-theme="light"] .er-src a:hover { color: #09090b; }
    html[data-theme="light"] .er-src .er-back { color: #047857; }
    html[data-theme="light"] .er-src .er-note { color: #63636b; }
    @media (max-width: 600px) { .er-src a { min-height: 34px; } }
  </style>
<!-- @bar -->
  <div class="er-src">
    <a class="er-back" href="../">&larr; Edge-Radar</a>
    <span class="er-note">Betting logic data flow</span>
    <a class="er-link" href="https://github.com/ai-automation-tools/edge-radar" target="_blank" rel="noopener">

  </div>
