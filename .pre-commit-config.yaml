# Generated by scripts/diagrams/build_betting_diagram.py. Its receipts pin their exact bytes,
# so a whitespace fixer touching them would make the diagram look stale.
exclude: ^(docs/diagrams/betting-data-flow\.(html|png|delivery\.json|sources\.lock\.json)|site/diagram/betting-data-flow\.(html|png))$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: [--branch, master]

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: [--line-length=100]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        # Quoted: an unquoted YAML flow sequence splits on the comma, so
        # `W503` became its own list item and reached flake8 as a FILENAME
        # (`E902 FileNotFoundError: 'W503'`), failing every run. Unnoticed
        # because the hooks were never installed on this machine.
        args: [--max-line-length=100, "--extend-ignore=E203,W503"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # Its pinned 40-char commit SHA reads as a hex secret, and --pin-head rewrites it.
        # site/registry/ is generated and every file carries sha256 content hashes, which read the
        # same way; an allowlist comment would change the bytes Cronsole verifies.
        exclude: ^(docs/diagrams/betting-data-flow\.json|site/registry/.*)$

  - repo: local
    hooks:
      - id: check-config-centralization
        name: Guard os.getenv/os.environ outside app/config.py
        entry: python scripts/lint/check_config_centralization.py
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: betting-diagram-drift
        name: Warn when code cited by docs/diagrams/betting-data-flow.json changed
        # Warns, never blocks: rebuilding needs Node + Chrome + Archify, which a commit
        # shouldn't depend on. See docs/diagrams/README.md for the fix.
        entry: python scripts/diagrams/build_betting_diagram.py --hook
        language: system
        files: ^(scripts|app)/.*\.py$|^docs/diagrams/betting-data-flow\.json$
        pass_filenames: false
        verbose: true
