# Dependency updates. Minor/patch bumps arrive as one grouped PR per ecosystem per week;
# major versions are ignored (2026-09-29): the biweekly upstream check flags a major that
# breaks something, and Dependabot security alerts still fire for any version.
# Semantic upstream drift (API, protocol) is the Edge-Radar Upstream
# Check routine's job -- see docs/UPSTREAMS.md.
# Live-money repo: these PRs are not auto-merged by any routine. Review before merging.
version: 2
updates:
  # No Python block (2026-11-17). requirements*.txt are universal hashed locks
  # (`make lock`). Dependabot's uv re-lock dropped --universal and the -c
  # constraint (#389): it removed the Windows-only tzdata and colorama and pinned
  # numpy/scipy to their 3.11 releases everywhere. Bump Python deps by hand with
  # `make lock`; security alerts still fire without a version-update block.
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
